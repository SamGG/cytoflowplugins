id = "flowbunch_create"
name = "Create flowBunch"
category = "FlowBunch"
tooltip = "Scan a directory of FCS files and create a flowBunch object with summary tables and visualizations."
version = "0.4.0"
api_version = 3
entry = "gui.py:FlowBunchCreateTool"
rmd = "script.Rmd"
help = "help.html"

[requires]
app = "0.10.0"
python = []
r = ["cytoElements", "ggplot2", "knitr", "jsonlite"]
bioc = []

# input: a folder of FCS files, possibly the data folder of a previous step
[[inputs]]
param = "fcs_dir"
kind = "fcs"
folder = true
lineage = true
label = "FCS folder"
